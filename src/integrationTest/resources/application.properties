# Firebolt Connection Properties
# For Kafka Connect 3.9.1 tests
firebolt.url=jdbc:firebolt://firebolt-core:8080/default
firebolt.username=test_user
firebolt.password=test_password

# For Kafka Connect 4.0 tests (different port)
firebolt.url.40=jdbc:firebolt://firebolt-core:8080/default
firebolt.username.40=test_user
firebolt.password.40=test_password

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.connect.host=http://localhost:8083
kafka.connect.port=8083

# Kafka Connect 4.0 Configuration (different ports)
kafka.bootstrap.servers.40=localhost:9093
kafka.connect.host.40=http://localhost:8084
kafka.connect.port.40=8084

# Test Configuration
test.timeout.minutes=2
test.cleanup.enabled=true
test.data.batch.size=1000

# Logging Configuration
logging.level.com.firebolt.kafka.connect=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.testcontainers=INFO

# Docker Configuration (no longer needed with Firebolt core image)
docker.firebolt.image.arch=amd64 