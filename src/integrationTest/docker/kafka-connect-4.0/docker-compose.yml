services:
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    hostname: kafka
    container_name: kafka-40
    ports:
      - "9092:9092"
    environment:
      # KRaft mode configuration (no ZooKeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Enable topic auto-creation for Kafka Connect internal topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # KRaft specific settings
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # Confluent image expects CLUSTER_ID env var
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    hostname: schema-registry
    container_name: schema-registry-40
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - kafka-network

  # Firebolt Core Database
  firebolt-core:
#    image: ghcr.io/firebolt-db/firebolt-core:preview-rc
    image: 231290928314.dkr.ecr.us-east-1.amazonaws.com/firebolt-core:debug-4.30.0-pre.0.20251118085534.02b3c9795d0e
    hostname: firebolt-core
    container_name: firebolt-core-40
    command: --node 0
    restart: no         # equivalent to --rm (no persistence)
    tty: true
    privileged: true
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: 8589934592
    ports:
      - 3473:3473
    networks:
      kafka-network:
        aliases:
          - firebolt-core.local
    volumes:
      # Mount the config file into the container.
      - ./config.json:/firebolt-core/config.json:ro
      # Create an anonymous volume for Firebolt's internal database files. Not using a volume would have a performance impact.
      - ./firebolt-core:/firebolt-core/data

  kafka-connect:
    image: confluentinc/cp-kafka-connect:8.0.0
    hostname: kafka-connect
    container_name: kafka-connect-40
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      firebolt-core:
        condition: service_started
    ports:
      - "8083:8083"
      - "5005:5005"  # Debug port
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group-40
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs-40
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets-40
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status-40
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/jars"
      CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: '[%d] %p %X{connector.context}%m (%c:%L)%n'
      CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR"
      # Enable JVM debugging
      KAFKA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      - ./plugins:/etc/kafka-connect/jars
      - ./configs:/etc/kafka-connect/configs
      - ./scripts:/etc/kafka-connect/scripts
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge

volumes:
  kafka-data: 