---
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:17"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "build(NoTicket)"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    ignore:
      # The major version selects the product (v1 = FB 1.0, v2 = FB 2.0), so it is not an upgrade.
      - dependency-name: "firebolt-db/integration-testing-setup"
        update-types: ["version-update:semver-major"]
      # Held at v6.2.0 until the licence change is reviewed: since v6, caching runs in the
      # proprietary `gradle-actions-caching` component under Gradle's commercial Terms of Use
      # (https://gradle.com/legal/terms-of-use/), accepted by using it with caching enabled.
      # https://github.com/gradle/actions/releases/tag/v6.0.0
      - dependency-name: "gradle/actions/setup-gradle"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "build(NoTicket)"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns:
          - "*"
