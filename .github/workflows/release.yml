name: Release new version

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish'
        type: string
        required: true
      release_summary:
        description: 'Release summary — semicolon-separated items become bullet points (e.g. "Feature A; Fix B; Update C")'
        type: string
        required: false
        
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name}}

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main branch
        run: |
          echo "github.ref=$GITHUB_REF"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be triggered from the main branch. Current ref: $GITHUB_REF"
            exit 1
          fi

  pre-release-testing:
     needs: validation
     uses: ./.github/workflows/pre-release-test.yml
     secrets: inherit

  bump-version:
    needs: pre-release-testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Bump version in gradle.properties
        run: |
          newVersion=$(echo $RELEASE_TAG | sed 's/^v//')
          sed -i.bak "s/^version=.*/version=$newVersion/" gradle.properties
          rm gradle.properties.bak

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Commit version bump
        run: |
          git add gradle.properties
          git commit -m "chore: Bump version to $RELEASE_TAG"

      - name: Create tag version
        run: |
          git tag ${RELEASE_TAG}

      - name: Push changes
        run: |
          git push origin main
          # push tag
          git push origin ${RELEASE_TAG}

  build:
    needs: bump-version
    uses: ./.github/workflows/build.yml
    with:
      # build from the exact tag that was created and pushed above
      branch: refs/tags/${{ github.event.inputs.tag_name }}
      buildArtifacts: true
      buildConfluentArchive: true

  publish:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refs/tags/${{ github.event.inputs.tag_name }}

      - name: Download uber-jar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.uber-jar }}
          path: uber-jar
      - name: Download sources-jar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.sources-jar }}
          path: sources-jar
      - name: Download confluent-archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.confluent-archive }}
          path: confluent-archive

      - name: List downloaded artifacts
        run: |
          echo "Workspace contents:"
          ls -la
          echo "uber-jar contents:"
          ls -la uber-jar || true
          echo "sources-jar contents:"
          ls -la sources-jar || true
          echo "confluent-archive contents:"
          ls -la confluent-archive || true

      # e6ac9c2ff1018fca4464bf2480155faeb66f9bdb == v1.6.1
      - uses: xresloader/upload-to-github-release@e6ac9c2ff1018fca4464bf2480155faeb66f9bdb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "uber-jar/**/*.jar;sources-jar/**/*.jar;confluent-archive/**/*.zip"
          tags: true
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}

      - name: Generate and update GitHub release notes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `${{ env.RELEASE_TAG }}`;
            const { owner, repo } = context.repo;
            // Fetch existing release by tag (created earlier by upload step)
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            // Generate notes based on PRs/commits between last release and this tag
            const notes = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag });
            // Sanitize internal JIRA links: [FIR-1234](...) -> `FIR-1234`, and wrap bare FIR-1234 in backticks
            let body = notes.data.body || '';
            body = body.replace(/\[(FIR-\d+)\]\([^)]*\)/g, '`$1`');
            body = body.replace(/(?<!`)\bFIR-\d+\b(?!`)/g, (m) => `\`${m}\``);
            // Update the release body with sanitized notes
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.data.id, body });

      - name: Derive release version
        id: release_version
        run: |
          ver=$(echo "${RELEASE_TAG}" | sed 's/^v//')
          echo "value=$ver" >> $GITHUB_OUTPUT

  notify:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # convert the comma separated values into a json
        channel: ${{ fromJson(vars.RELEASE_NOTES_SLACK_CHANNELS) }}
    steps:
      - run: test -n "${{ secrets.SLACK_BOT_TOKEN }}" || (echo "SLACK_BOT_TOKEN is empty" && exit 1)

      - name: Build Slack notification blocks
        id: slack
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
          RELEASE_SUMMARY: ${{ github.event.inputs.release_summary }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          MAIN_MSG=":tada: Firebolt Sink Connector \`${RELEASE_VERSION}\` has been released — <${RELEASE_URL}|Release notes>"

          if [ -n "$RELEASE_SUMMARY" ]; then
            # Convert semicolon-separated items into a bulleted list for Slack
            SUMMARY_TEXT=$(echo "$RELEASE_SUMMARY" \
              | tr ';' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | sed '/^$/d' \
              | sed 's/^/• /')
            FORMATTED_SUMMARY=$(printf '* Release summary:*\n%s' "$SUMMARY_TEXT")
            BLOCKS=$(jq -nc \
              --arg main "$MAIN_MSG" \
              --arg summary "$FORMATTED_SUMMARY" \
              '[{"type":"section","text":{"type":"mrkdwn","text":$main}},{"type":"section","text":{"type":"mrkdwn","text":$summary}}]')
          else
            BLOCKS=$(jq -nc \
              --arg main "$MAIN_MSG" \
              '[{"type":"section","text":{"type":"mrkdwn","text":$main}}]')
          fi

          echo "blocks=${BLOCKS}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of Kafka Sink Connector
        # 91efab103c0de0a537f72a35f6b8cda0ee76bf0a is v2.1.1
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ matrix.channel }}
            text: "Firebolt Sink Connector `${{ needs.publish.outputs.release_version }}` has been released: <https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}|Release notes>"
            blocks: ${{ steps.slack.outputs.blocks }}