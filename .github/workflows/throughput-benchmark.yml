name: Throughput Benchmark

on:
  # Called from all-core-integration-tests.yml on every PR/push to main.
  # Receives pr_number and head_sha so the comment lands on the right PR.
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number for posting the comment (0 = push to main)'
        required: false
        type: number
        default: 0
      head_sha:
        description: 'Head commit SHA to label results'
        required: false
        type: string
        default: ''
  # Standalone triggers: useful for manual re-runs after merge.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  FIREBOLT_CORE_IMAGE: ${{ vars.FIREBOLT_CORE_IMAGE }}
  COMPOSE_FILE: src/integrationTest/docker/kafka-connect-3.9.1/docker-compose.yml
  COMPOSE_FILE_DIR: src/integrationTest/docker/kafka-connect-3.9.1

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up JDK 11
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build project
      run: ./gradlew build --no-daemon

    - name: Deploy to Kafka Connect
      run: ./gradlew deployToKafkaConnect --no-daemon

    - name: Setup firebolt core permissions
      run: |
        WHO="$(docker run --rm --entrypoint whoami ${{ vars.FIREBOLT_CORE_IMAGE }})"
        if [ "$WHO" = "firebolt-core" ]; then
          mkdir -p "$COMPOSE_FILE_DIR/firebolt-core"
          sudo chown 1111:1111 "$COMPOSE_FILE_DIR/firebolt-core"
        fi

    - name: Start Docker services
      run: |
        docker compose -f "$COMPOSE_FILE" up -d
        echo "Waiting for services to be ready..."
        sleep 30
        timeout 60 bash -c 'until curl -sf http://localhost:8083/connectors; do sleep 2; done'
        echo "Kafka Connect is ready!"

    - name: Run benchmark (10s produce window, JSON / {at_least_once,exactly_once} / sql)
      run: |
        ./gradlew integrationTest \
          -Djunit.jupiter.includeTags=e2e \
          -De2e.singleIngestion=sql \
          -De2e.duration=PT10S \
          -De2e.ingestionTimeout=PT10M \
          -De2e.benchmark=true \
          --no-daemon \
          --tests "com.firebolt.kafka.connect.e2e.E2EMessageTypeTest.testIngestion"
      env:
        KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        SCHEMA_REGISTRY_URL: http://localhost:8081
        KAFKA_CONNECT_URL: http://localhost:8083
        # Prefer the PR head SHA; fall back to push SHA.
        GITHUB_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

    - name: Upload benchmark results
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: benchmark-results-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        path: build/reports/benchmark/

    - name: Post PR comment
      # Post when triggered via workflow_call with a pr_number, or directly on a pull_request event.
      if: >
        success() && (
          (github.event_name == 'workflow_call' && inputs.pr_number != 0) ||
          github.event_name == 'pull_request'
        )
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const fs = require('fs');

          const CELLS = ['at_least_once-sql', 'exactly_once-sql'];
          const results = {};
          for (const cell of CELLS) {
            try {
              results[cell] = JSON.parse(fs.readFileSync(`build/reports/benchmark/results-${cell}.json`, 'utf8'));
            } catch (e) {
              console.log(`No results for ${cell}`);
            }
          }

          let baseline = {};
          try {
            baseline = JSON.parse(fs.readFileSync('specs/benchmarks/baseline.json', 'utf8'));
          } catch (e) {
            console.log('No baseline found — showing results only');
          }

          function fmt(n) { return Number(n).toLocaleString('en-US'); }
          function delta(cur, base) {
            if (base === null || base === undefined || base === 0) return '';
            const pct = ((cur - base) / base * 100).toFixed(1);
            const sign = pct >= 0 ? '+' : '';
            const icon = pct >= -5 ? (pct >= 5 ? ' 🚀' : ' ✅') : ' ⚠️';
            return `${sign}${pct}%${icon}`;
          }

          const CELL_LABELS = { 'at_least_once-sql': 'AT_LEAST_ONCE', 'exactly_once-sql': 'EXACTLY_ONCE' };
          const anySha = (results['at_least_once-sql'] || results['exactly_once-sql'] || {}).commit_sha || 'unknown';
          const sha = anySha.slice(0, 7);
          const hasBaseline = Object.keys(baseline).length > 0;
          const bsha = hasBaseline ? (baseline['at_least_once-sql'] || Object.values(baseline)[0] || {}).commit_sha?.slice(0, 7) : null;

          let table;
          if (hasBaseline && bsha) {
            table = `| Delivery | Produce rate | Throughput | Ingest rate | vs Baseline |\n`;
            table += `|----------|-------------|------------|-------------|-------------|\n`;
          } else {
            table = `| Delivery | Produce rate | Throughput | Ingest rate | Records |\n`;
            table += `|----------|-------------|------------|-------------|--------|\n`;
          }

          for (const cell of CELLS) {
            const r = results[cell];
            if (!r) continue;
            const label = CELL_LABELS[cell];
            const b = baseline[cell];
            if (hasBaseline && bsha) {
              const d = delta(r.produce_rate_records_per_sec, b?.produce_rate_records_per_sec);
              table += `| ${label} | ${fmt(r.produce_rate_records_per_sec)} rec/s | ${r.produce_throughput_mb_per_sec} MB/s | ${fmt(r.ingest_rate_records_per_sec)} rec/s | ${d} |\n`;
            } else {
              table += `| ${label} | ${fmt(r.produce_rate_records_per_sec)} rec/s | ${r.produce_throughput_mb_per_sec} MB/s | ${fmt(r.ingest_rate_records_per_sec)} rec/s | ${fmt(r.total_records_produced)} |\n`;
            }
          }

          const durationSec = (results['at_least_once-sql'] || results['exactly_once-sql'] || {}).duration_seconds || 10;
          const recordSize = (results['at_least_once-sql'] || results['exactly_once-sql'] || {}).record_size_bytes || 256;
          const baselineNote = hasBaseline && bsha ? ` · baseline: main @ \`${bsha}\`` : '';

          const body = [
            '## Throughput Benchmark Results',
            '',
            hasBaseline && bsha ? `_This PR: \`${sha}\`${baselineNote}_` : `_This PR: \`${sha}\`_`,
            '',
            table,
            `_JSON / SQL · ${durationSec}s produce window · ${recordSize}B records_`,
          ].join('\n');

          const MARKER = '## Throughput Benchmark Results';
          // inputs.pr_number is set when called from all-core-integration-tests.yml;
          // context.issue.number is set for direct pull_request events.
          const issueNumber = ${{ inputs.pr_number || 0 }} || context.issue.number;

          // Paginate to handle PRs with many comments.
          const allComments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
          });
          const existing = allComments.find(c => c.body.includes(MARKER));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          }

    - name: Update baseline (main only)
      if: >
        success() && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_call' && inputs.pr_number == 0)
        )
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p specs/benchmarks
        # Merge per-cell result files into a single baseline JSON object keyed by cell name.
        baseline="{}"
        for f in build/reports/benchmark/results-*.json; do
          cell=$(basename "$f" .json); cell="${cell#results-}"
          baseline=$(jq --arg k "$cell" --slurpfile v "$f" '. + {($k): $v[0]}' <<<"$baseline")
        done
        echo "$baseline" > specs/benchmarks/baseline.json
        git add specs/benchmarks/baseline.json
        git diff --staged --quiet && echo "Baseline unchanged" && exit 0
        git commit -m "chore: update benchmark baseline [skip ci]"
        git pull --rebase
        git push

    - name: Stop Docker services
      if: always()
      run: docker compose -f "$COMPOSE_FILE" down -v
