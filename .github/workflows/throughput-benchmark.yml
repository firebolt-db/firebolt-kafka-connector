name: Throughput Benchmark

on:
  # Called from all-core-integration-tests.yml on every PR/push to main.
  # Receives pr_number and head_sha so the comment lands on the right PR.
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number for posting the comment (0 = push to main)'
        required: false
        type: number
        default: 0
      head_sha:
        description: 'Head commit SHA to label results'
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # OSS Firebolt engine artefact. Overridable via the FIREBOLT_ENGINE_IMAGE repo
  # variable; falls back to a pinned, validated tag.
  FIREBOLT_ENGINE_IMAGE: ${{ vars.FIREBOLT_ENGINE_IMAGE || 'ghcr.io/firebolt-db/engine:release-5.0.1-0.20260615205019.4f5c69172cd3' }}
  COMPOSE_FILE: src/integrationTest/docker/kafka-connect-3.9.1/docker-compose.yml
  COMPOSE_FILE_DIR: src/integrationTest/docker/kafka-connect-3.9.1

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

    - name: Fetch baseline
      run: |
        mkdir -p specs/benchmarks
        git fetch origin benchmarks/baseline --depth=1 2>/dev/null \
          && git show FETCH_HEAD:baseline.json > specs/benchmarks/baseline.json 2>/dev/null \
          || echo "No baseline yet — first run"

    - name: Set up JDK 11
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build project
      run: ./gradlew build --no-daemon

    - name: Deploy to Kafka Connect
      run: ./gradlew deployToKafkaConnect --no-daemon

    - name: Setup firebolt engine data directory permissions
      run: |
        # The engine runs as a non-root user and writes into the /firebolt-core/volume
        # bind mount, so the host dir must be owned by the image's uid:gid. Read it from
        # the image rather than hardcoding (a root image yields 0:0, a harmless no-op).
        ENGINE_UID="$(docker run --rm --entrypoint id "$FIREBOLT_ENGINE_IMAGE" -u)"
        ENGINE_GID="$(docker run --rm --entrypoint id "$FIREBOLT_ENGINE_IMAGE" -g)"
        mkdir -p "$COMPOSE_FILE_DIR/firebolt-core"
        sudo chown "$ENGINE_UID:$ENGINE_GID" "$COMPOSE_FILE_DIR/firebolt-core"

    - name: Start Docker services
      run: |
        docker compose -f "$COMPOSE_FILE" up -d
        echo "Waiting for services to be ready..."
        sleep 30
        timeout 60 bash -c 'until curl -sf http://localhost:8083/connectors; do sleep 2; done'
        echo "Kafka Connect is ready!"

    - name: Run benchmark (10s produce window, JSON / {at_least_once,exactly_once} / sql)
      run: |
        ./gradlew integrationTest \
          -Djunit.jupiter.includeTags=e2e \
          -De2e.singleIngestion=sql \
          -De2e.duration=PT10S \
          -De2e.ingestionTimeout=PT10M \
          -De2e.benchmark=true \
          --no-daemon \
          --tests "com.firebolt.kafka.connect.e2e.E2EMessageTypeTest.testIngestion"
      env:
        KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        SCHEMA_REGISTRY_URL: http://localhost:8081
        KAFKA_CONNECT_URL: http://localhost:8083
        # Prefer the PR head SHA; fall back to push SHA.
        GITHUB_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: benchmark-results-${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        path: build/reports/benchmark/

    - name: Post PR comment
      if: success() && inputs.pr_number != 0
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body=$(python3 scripts/post_benchmark_comment.py)
        existing=$(gh api "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" \
          --paginate --jq '[.[] | select(.body | startswith("## Throughput Benchmark Results"))] | last | .id // empty')
        if [ -n "$existing" ]; then
          gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -f body="$body"
        else
          gh pr comment "${{ inputs.pr_number }}" --body "$body" --repo "${{ github.repository }}"
        fi

    - name: Update baseline (main only)
      if: success() && inputs.pr_number == 0 && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        baseline="{}"
        for f in build/reports/benchmark/results-*.json; do
          cell=$(basename "$f" .json); cell="${cell#results-}"
          baseline=$(jq --arg k "$cell" --slurpfile v "$f" '. + {($k): $v[0]}' <<<"$baseline")
        done
        CONTENT=$(printf '%s' "$baseline" | base64 -w0)
        REPO="${{ github.repository }}"
        BRANCH="benchmarks/baseline"
        FILE="baseline.json"
        # Ensure the branch exists (no-op if already present).
        gh api "repos/$REPO/git/refs" -X POST \
          -f ref="refs/heads/$BRANCH" -f sha="${{ github.sha }}" 2>/dev/null || true
        # Get current file SHA so the PUT is treated as an update, not a conflict.
        SHA=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha' 2>/dev/null || echo "")
        ARGS=(-X PUT -f message="chore: update benchmark baseline" -f content="$CONTENT" -f branch="$BRANCH")
        [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
        gh api "repos/$REPO/contents/$FILE" "${ARGS[@]}"

    - name: Stop Docker services
      if: always()
      run: docker compose -f "$COMPOSE_FILE" down -v
