name: Load Test

on:
  workflow_dispatch:
    inputs:
      firebolt_jdbc_url:
        description: 'Firebolt JDBC URL (e.g., jdbc:firebolt:db?account=acc&engine=eng&env=staging)'
        required: true
        default: 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging'
      connector_plugin_id:
        description: 'Confluent Firebolt Connector Plugin ID (leave empty to use repository default)'
        required: false
      confluent_environment_id:
        description: 'Confluent Environment ID (leave empty to use repository default)'
        required: false
      confluent_cluster_id:
        description: 'Confluent Cluster ID (leave empty to use repository default)'
        required: false
      message_sizes:
        description: 'Message sizes to test (comma separated: 100,500,1000)'
        required: false
        default: '100,500,1000,5000,10000'
      message_count:
        description: 'Number of messages to produce and consume (default: 1,000,000)'
        required: false
        default: '1000000'
      table_schema:
        description: 'Table schema to test (8-column, 80-column, 8-column-with-default-timestamp)'
        required: false
        default: '8-column'
        type: choice
        options:
          - '8-column'
          - '8-column-with-default-timestamp'
          - '80-column'
          - '400-column'
          - '1000-column'
      ingestion_type:
        description: 'Ingestion type to use (sql or binary)'
        required: false
        default: 'sql'
        type: choice
        options:
          - 'sql'
          - 'binary'
      message_type:
        description: 'Message format to publish (json or avro)'
        required: false
        default: 'json'
        type: choice
        options:
          - 'json'
          - 'avro'
      has_schema:
        description: 'Whether messages have schema (default: true)'
        required: false
        type: boolean
        default: true
      min_fetch_megabytes:
        description: 'Minimum fetch size in MB (maps to consumer.override.fetch.min.bytes)'
        required: false
        default: '20'
      max_wait_time_ms:
        description: 'Max wait time in ms (maps to consumer.override.fetch.max.wait.ms)'
        required: false
        default: '2000'
      max_records_poll:
        description: 'Max records per poll (maps to consumer.override.max.poll.records)'
        required: false
        default: '10000'

  workflow_call:
    inputs:
      firebolt_jdbc_url:
        required: false
        type: string
        default: 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging'
      connector_plugin_id:
        required: false
        type: string
      confluent_environment_id:
        required: false
        type: string
      confluent_cluster_id:
        required: false
        type: string
      message_sizes:
        required: false
        type: string
        default: '100,500,1000,5000,10000'
      message_count:
        required: false
        type: string
        default: '1000000'
      table_schema:
        required: false
        type: string
        default: '8-column'
      ingestion_type:
        required: false
        type: string
        default: 'sql'
      min_fetch_megabytes:
        required: false
        type: string
        default: '20'
      max_wait_time_ms:
        required: false
        type: string
        default: '2000'
      max_records_poll:
        required: false
        type: string
        default: '10000'
      message_type:
        required: false
        type: string
        default: 'json'
      has_schema:
        required: false
        type: boolean
        default: true
    secrets:
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: false
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: false
      CONFLUENT_KAFKA_API_KEY:
        required: false
      CONFLUENT_KAFKA_API_SECRET:
        required: false
      CONFLUENT_SCHEMA_REGISTRY_API_KEY:
        required: false
      CONFLUENT_SCHEMA_REGISTRY_API_SECRET:
        required: false
      CONFLUENT_CLOUD_RESOURCE_API_KEY:
        required: false
      CONFLUENT_CLOUD_RESOURCE_API_SECRET:
        required: false

permissions: {}

jobs:
  load-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 300  # 5 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
          
      - name: Run Load Test
        # Credentials reach the test JVM via the LT_* env vars below (see
        # build.gradle), not as -D arguments on the command line.
        run: |
          ./gradlew runLoadTest \
            -Dfirebolt.jdbc.url="${LT_FIREBOLT_JDBC_URL}" \
            -Dconfluent.environment.id="${LT_CONFLUENT_ENVIRONMENT_ID}" \
            -Dconfluent.cluster.id="${LT_CONFLUENT_CLUSTER_ID}" \
            -Dconfluent.firebolt.connector.plugin.id="${LT_CONFLUENT_FIREBOLT_CONNECTOR_PLUGIN_ID}" \
            -Dloadtest.message.sizes="${LT_LOADTEST_MESSAGE_SIZES}" \
            -Dloadtest.message.count="${LT_LOADTEST_MESSAGE_COUNT}" \
            -Dloadtest.table.schema="${LT_LOADTEST_TABLE_SCHEMA}" \
            -Dloadtest.ingestion.type="${LT_LOADTEST_INGESTION_TYPE}" \
            -Dloadtest.message.type="${LT_LOADTEST_MESSAGE_TYPE}" \
            -Dloadtest.has.schema="${LT_LOADTEST_HAS_SCHEMA}" \
            -Dloadtest.fetch.min.megabytes="${LT_LOADTEST_FETCH_MIN_MEGABYTES}" \
            -Dloadtest.fetch.max.wait.ms="${LT_LOADTEST_FETCH_MAX_WAIT_MS}" \
            -Dloadtest.max.poll.records="${LT_LOADTEST_MAX_POLL_RECORDS}"
        env:
          LT_FIREBOLT_JDBC_URL: ${{ inputs.firebolt_jdbc_url || github.event.inputs.firebolt_jdbc_url || 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging' }}
          LT_FIREBOLT_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          LT_FIREBOLT_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          LT_CONFLUENT_ENVIRONMENT_ID: ${{ inputs.confluent_environment_id || github.event.inputs.confluent_environment_id || vars.CONFLUENT_ENVIRONMENT_ID }}
          LT_CONFLUENT_CLUSTER_ID: ${{ inputs.confluent_cluster_id || github.event.inputs.confluent_cluster_id || vars.CONFLUENT_CLUSTER_ID }}
          LT_CONFLUENT_FIREBOLT_CONNECTOR_PLUGIN_ID: ${{ inputs.connector_plugin_id || github.event.inputs.connector_plugin_id || vars.CONFLUENT_CONNECTOR_PLUGIN_ID }}
          LT_CONFLUENT_KAFKA_API_KEY: ${{ secrets.CONFLUENT_KAFKA_API_KEY }}
          LT_CONFLUENT_KAFKA_API_SECRET: ${{ secrets.CONFLUENT_KAFKA_API_SECRET }}
          LT_CONFLUENT_SCHEMA_REGISTRY_API_KEY: ${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_KEY }}
          LT_CONFLUENT_SCHEMA_REGISTRY_API_SECRET: ${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_SECRET }}
          LT_CONFLUENT_CLOUD_RESOURCE_API_KEY: ${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_KEY }}
          LT_CONFLUENT_CLOUD_RESOURCE_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_SECRET }}
          LT_LOADTEST_MESSAGE_SIZES: ${{ inputs.message_sizes || github.event.inputs.message_sizes || '100,500,1000,5000,10000' }}
          LT_LOADTEST_MESSAGE_COUNT: ${{ inputs.message_count || github.event.inputs.message_count || '1000000' }}
          LT_LOADTEST_TABLE_SCHEMA: ${{ inputs.table_schema || github.event.inputs.table_schema || '8-column' }}
          LT_LOADTEST_INGESTION_TYPE: ${{ inputs.ingestion_type || github.event.inputs.ingestion_type || 'sql' }}
          LT_LOADTEST_MESSAGE_TYPE: ${{ inputs.message_type || github.event.inputs.message_type || 'json' }}
          LT_LOADTEST_HAS_SCHEMA: ${{ inputs.has_schema || github.event.inputs.has_schema || 'true' }}
          LT_LOADTEST_FETCH_MIN_MEGABYTES: ${{ inputs.min_fetch_megabytes || github.event.inputs.min_fetch_megabytes || '20' }}
          LT_LOADTEST_FETCH_MAX_WAIT_MS: ${{ inputs.max_wait_time_ms || github.event.inputs.max_wait_time_ms || '2000' }}
          LT_LOADTEST_MAX_POLL_RECORDS: ${{ inputs.max_records_poll || github.event.inputs.max_records_poll || '10000' }}
          # Additional environment variables if needed
          GRADLE_OPTS: "-Xmx2g"
      
      - name: Compute Artifact Name Vars
        env:
          LT_TABLE_SCHEMA: ${{ inputs.table_schema || github.event.inputs.table_schema || '8-column' }}
          LT_INGESTION_TYPE: ${{ inputs.ingestion_type || github.event.inputs.ingestion_type || 'sql' }}
          LT_MESSAGE_TYPE: ${{ inputs.message_type || github.event.inputs.message_type || 'json' }}
        run: |
          SCHEMA="${LT_TABLE_SCHEMA}"
          SCHEMA_PLURAL="${SCHEMA/-column/-columns}"
          ING="${LT_INGESTION_TYPE}"
          MSG="${LT_MESSAGE_TYPE}"
          {
            echo "SCHEMA_PLURAL=${SCHEMA_PLURAL}"
            echo "INGESTION_TYPE=${ING}"
            echo "MESSAGE_TYPE=${MSG}"
          } >> "$GITHUB_ENV"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-results-${{ env.SCHEMA_PLURAL }}-${{ env.INGESTION_TYPE }}-${{ env.MESSAGE_TYPE }}-${{ github.run_number }}
          path: |
            build/reports/
            build/test-results/
            build/load-test-logs/
            *.log
          retention-days: 30
