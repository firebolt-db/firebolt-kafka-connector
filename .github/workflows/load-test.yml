name: Load Test

on:
  workflow_dispatch:
    inputs:
      firebolt_jdbc_url:
        description: 'Firebolt JDBC URL (e.g., jdbc:firebolt:db?account=acc&engine=eng&env=staging)'
        required: true
        default: 'jdbc:firebolt:sink-connector-load-test?account=goprean-us-east&engine=sink_connector_load_test&env=staging'
      connector_plugin_id:
        description: 'Confluent Firebolt Connector Plugin ID (leave empty to use repository default)'
        required: false
      confluent_environment_id:
        description: 'Confluent Environment ID (leave empty to use repository default)'
        required: false
      confluent_cluster_id:
        description: 'Confluent Cluster ID (leave empty to use repository default)'
        required: false
      message_sizes:
        description: 'Message sizes to test (comma separated: 100,500,1000)'
        required: false
        default: '100,500,1000,5000,10000'
      message_count:
        description: 'Number of messages to produce and consume (default: 1,000,000)'
        required: false
        default: '1000000'
      table_schema:
        description: 'Table schema to test (8-column, 80-column, 8-column-with-default-timestamp)'
        required: false
        default: '8-column'
        type: choice
        options:
          - '8-column'
          - '8-column-with-default-timestamp'
          - '80-column'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]


jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Show Trigger Info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🚀 Load Test triggered by Draft Pull Request #${{ github.event.pull_request.number }}"
            echo "📝 PR Title: ${{ github.event.pull_request.title }}"
            echo "👤 Author: ${{ github.event.pull_request.user.login }}"
            echo "🔀 Branch: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}"
          else
            echo "🚀 Load Test triggered manually via workflow_dispatch"
          fi
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          
      - name: Build LoadTest JAR
        run: |
          echo "🔨 Building LoadTest standalone JAR..."
          ./gradlew buildLoadTestJar
          
          # Verify JAR was created
          if [ ! -f "build/libs/firebolt-kafka-load-test-0.1-standalone.jar" ]; then
            echo "❌ LoadTest JAR was not created"
            exit 1
          fi
          
          echo "✅ LoadTest JAR built successfully"
          ls -lh build/libs/firebolt-kafka-load-test-*-standalone.jar
          
      - name: Run Load Test (Standalone JAR)
        id: load_test
        run: |
          set +e  # Don't exit on error - we need to check exit codes
          
          echo "🚀 Running LoadTest using standalone JAR (no Gradle overhead)..."
          
          # Define JVM options for clean execution
          JVM_OPTS=(
            -Xmx4g
            -Xms1g
            -Djava.awt.headless=true
            -XX:+UseSerialGC
            -XX:+DisableExplicitGC
            -XX:+ExitOnOutOfMemoryError
            -XX:+CrashOnOutOfMemoryError
          )
          
          # Run the JAR with system properties
          java "${JVM_OPTS[@]}" \
            -Dfirebolt.jdbc.url="${{ github.event.inputs.firebolt_jdbc_url || 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging' }}" \
            -Dfirebolt.client.id="${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}" \
            -Dfirebolt.client.secret="${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}" \
            -Dconfluent.environment.id="${{ github.event.inputs.confluent_environment_id || vars.CONFLUENT_ENVIRONMENT_ID }}" \
            -Dconfluent.cluster.id="${{ github.event.inputs.confluent_cluster_id || vars.CONFLUENT_CLUSTER_ID }}" \
            -Dconfluent.firebolt.connector.plugin.id="${{ github.event.inputs.connector_plugin_id || vars.CONFLUENT_CONNECTOR_PLUGIN_ID }}" \
            -Dconfluent.kafka.api.key="${{ secrets.CONFLUENT_KAFKA_API_KEY }}" \
            -Dconfluent.kafka.api.secret="${{ secrets.CONFLUENT_KAFKA_API_SECRET }}" \
            -Dconfluent.schema.registry.api.key="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_KEY }}" \
            -Dconfluent.schema.registry.api.secret="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_SECRET }}" \
            -Dconfluent.cloud.resource.api.key="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_KEY }}" \
            -Dconfluent.cloud.resource.api.secret="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_SECRET }}" \
            -Dloadtest.message.sizes="${{ github.event.inputs.message_sizes || '500' }}" \
            -Dloadtest.message.count="${{ github.event.inputs.message_count || '20000' }}" \
            -Dloadtest.table.schema="${{ github.event.inputs.table_schema || '8-column' }}" \
            -jar build/libs/firebolt-kafka-load-test-0.1-standalone.jar
          
          EXIT_CODE=$?
          echo "Load test exit code: $EXIT_CODE"
          
          # Exit code 137 means Runtime.halt(137) was called to prevent hanging
          # This is considered SUCCESS in our case
          if [ $EXIT_CODE -eq 137 ]; then
            echo "✅ Load test completed successfully (forced exit to prevent hanging)"
            exit 0
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Load test completed successfully (clean exit)"
            exit 0
          else
            echo "❌ Load test failed with exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_number }}
          path: |
            build/reports/
            build/test-results/
            *.log
          retention-days: 30
