name: Load Test

on:
  workflow_dispatch:
    inputs:
      firebolt_jdbc_url:
        description: 'Firebolt JDBC URL (e.g., jdbc:firebolt:db?account=acc&engine=eng&env=staging)'
        required: true
        default: 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging'
      connector_plugin_id:
        description: 'Confluent Firebolt Connector Plugin ID (leave empty to use repository default)'
        required: false
      confluent_environment_id:
        description: 'Confluent Environment ID (leave empty to use repository default)'
        required: false
      confluent_cluster_id:
        description: 'Confluent Cluster ID (leave empty to use repository default)'
        required: false
      message_sizes:
        description: 'Message sizes to test (comma separated: 100,500,1000)'
        required: false
        default: '100,500,1000,5000,10000'
      message_count:
        description: 'Number of messages to produce and consume (default: 1,000,000)'
        required: false
        default: '1000000'
      table_schema:
        description: 'Table schema to test (8-column, 80-column, 8-column-with-default-timestamp)'
        required: false
        default: '8-column'
        type: choice
        options:
          - '8-column'
          - '8-column-with-default-timestamp'
          - '80-column'
          - '400-column'
          - '1000-column'
      ingestion_type:
        description: 'Ingestion type to use (sql or binary)'
        required: false
        default: 'sql'
        type: choice
        options:
          - 'sql'
          - 'binary'
      message_type:
        description: 'Message format to publish (json or avro)'
        required: false
        default: 'json'
        type: choice
        options:
          - 'json'
          - 'avro'
      has_schema:
        description: 'Whether messages have schema (default: true)'
        required: false
        type: boolean
        default: true
      min_fetch_megabytes:
        description: 'Minimum fetch size in MB (maps to consumer.override.fetch.min.bytes)'
        required: false
        default: '20'
      max_wait_time_ms:
        description: 'Max wait time in ms (maps to consumer.override.fetch.max.wait.ms)'
        required: false
        default: '2000'
      max_records_poll:
        description: 'Max records per poll (maps to consumer.override.max.poll.records)'
        required: false
        default: '10000'

  workflow_call:
    inputs:
      firebolt_jdbc_url:
        required: false
        type: string
        default: 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging'
      connector_plugin_id:
        required: false
        type: string
      confluent_environment_id:
        required: false
        type: string
      confluent_cluster_id:
        required: false
        type: string
      message_sizes:
        required: false
        type: string
        default: '100,500,1000,5000,10000'
      message_count:
        required: false
        type: string
        default: '1000000'
      table_schema:
        required: false
        type: string
        default: '8-column'
      ingestion_type:
        required: false
        type: string
        default: 'sql'
      min_fetch_megabytes:
        required: false
        type: string
        default: '20'
      max_wait_time_ms:
        required: false
        type: string
        default: '2000'
      max_records_poll:
        required: false
        type: string
        default: '10000'
      message_type:
        required: false
        type: string
        default: 'json'
      has_schema:
        required: false
        type: boolean
        default: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        
      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: false
          
      - name: Run Load Test
        run: |
          ./gradlew runLoadTest \
            -Dfirebolt.jdbc.url="${{ inputs.firebolt_jdbc_url || github.event.inputs.firebolt_jdbc_url || 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging' }}" \
            -Dfirebolt.client.id="${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}" \
            -Dfirebolt.client.secret="${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}" \
            -Dconfluent.environment.id="${{ inputs.confluent_environment_id || github.event.inputs.confluent_environment_id || vars.CONFLUENT_ENVIRONMENT_ID }}" \
            -Dconfluent.cluster.id="${{ inputs.confluent_cluster_id || github.event.inputs.confluent_cluster_id || vars.CONFLUENT_CLUSTER_ID }}" \
            -Dconfluent.firebolt.connector.plugin.id="${{ inputs.connector_plugin_id || github.event.inputs.connector_plugin_id || vars.CONFLUENT_CONNECTOR_PLUGIN_ID }}" \
            -Dconfluent.kafka.api.key="${{ secrets.CONFLUENT_KAFKA_API_KEY }}" \
            -Dconfluent.kafka.api.secret="${{ secrets.CONFLUENT_KAFKA_API_SECRET }}" \
            -Dconfluent.schema.registry.api.key="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_KEY }}" \
            -Dconfluent.schema.registry.api.secret="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_SECRET }}" \
            -Dconfluent.cloud.resource.api.key="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_KEY }}" \
            -Dconfluent.cloud.resource.api.secret="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_SECRET }}" \
            -Dloadtest.message.sizes="${{ inputs.message_sizes || github.event.inputs.message_sizes || '100,500,1000,5000,10000' }}" \
            -Dloadtest.message.count="${{ inputs.message_count || github.event.inputs.message_count || '1000000' }}" \
            -Dloadtest.table.schema="${{ inputs.table_schema || github.event.inputs.table_schema || '8-column' }}" \
            -Dloadtest.ingestion.type="${{ inputs.ingestion_type || github.event.inputs.ingestion_type || 'sql' }}" \
            -Dloadtest.message.type="${{ inputs.message_type || github.event.inputs.message_type || 'json' }}" \
            -Dloadtest.has.schema="${{ inputs.has_schema || github.event.inputs.has_schema || 'true' }}" \
            -Dloadtest.fetch.min.megabytes="${{ inputs.min_fetch_megabytes || github.event.inputs.min_fetch_megabytes || '20' }}" \
            -Dloadtest.fetch.max.wait.ms="${{ inputs.max_wait_time_ms || github.event.inputs.max_wait_time_ms || '2000' }}" \
            -Dloadtest.max.poll.records="${{ inputs.max_records_poll || github.event.inputs.max_records_poll || '10000' }}"
        env:
          # Additional environment variables if needed
          GRADLE_OPTS: "-Xmx2g"
      
      - name: Compute Artifact Name Vars
        run: |
          SCHEMA="${{ inputs.table_schema || github.event.inputs.table_schema || '8-column' }}"
          SCHEMA_PLURAL="${SCHEMA/-column/-columns}"
          echo "SCHEMA_PLURAL=${SCHEMA_PLURAL}" >> $GITHUB_ENV
          ING="${{ inputs.ingestion_type || github.event.inputs.ingestion_type || 'sql' }}"
          echo "INGESTION_TYPE=${ING}" >> $GITHUB_ENV
          MSG="${{ inputs.message_type || github.event.inputs.message_type || 'json' }}"
          echo "MESSAGE_TYPE=${MSG}" >> $GITHUB_ENV

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: load-test-results-${{ env.SCHEMA_PLURAL }}-${{ env.INGESTION_TYPE }}-${{ env.MESSAGE_TYPE }}-${{ github.run_number }}
          path: |
            build/reports/
            build/test-results/
            build/load-test-logs/
            *.log
          retention-days: 30
