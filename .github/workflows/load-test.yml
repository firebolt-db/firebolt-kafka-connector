name: Load Test

on:
  workflow_dispatch:
    inputs:
      firebolt_jdbc_url:
        description: 'Firebolt JDBC URL (e.g., jdbc:firebolt:db?account=acc&engine=eng&env=staging)'
        required: true
        default: 'jdbc:firebolt:ecosystem-kafka-load-test?account=automation&engine=ecosystem_kafka_load_test&env=staging'
      connector_plugin_id:
        description: 'Confluent Firebolt Connector Plugin ID (leave empty to use repository default)'
        required: false
      confluent_environment_id:
        description: 'Confluent Environment ID (leave empty to use repository default)'
        required: false
      confluent_cluster_id:
        description: 'Confluent Cluster ID (leave empty to use repository default)'
        required: false
      query:
        description: 'SQL query to fetch records from Firebolt (REQUIRED for schemaless query load test)'
        required: true
      post_processing_script:
        description: 'Post-processing SQL script (default: select 1)'
        required: false
        default: 'select 1'
      table_schema:
        description: 'Table schema file path (optional - if not provided, assumes table exists)'
        required: false
      connector_name:
        description: 'Connector name (default: schemaless-query-load-test)'
        required: false
        default: 'schemaless-query-load-test'
      topic_name:
        description: 'Topic name (default: schemaless-query-load-test-topic)'
        required: false
        default: 'schemaless-query-load-test-topic'


jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          
      - name: Run Schemaless Query Load Test
        run: |
          ./gradlew runSchemalessQueryLoadTest \
            -Dfirebolt.jdbc.url="${{ github.event.inputs.firebolt_jdbc_url }}" \
            -Dfirebolt.client.id="${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}" \
            -Dfirebolt.client.secret="${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}" \
            -Dconfluent.environment.id="${{ github.event.inputs.confluent_environment_id || vars.CONFLUENT_ENVIRONMENT_ID }}" \
            -Dconfluent.cluster.id="${{ github.event.inputs.confluent_cluster_id || vars.CONFLUENT_CLUSTER_ID }}" \
            -Dconfluent.firebolt.connector.plugin.id="${{ github.event.inputs.connector_plugin_id || vars.CONFLUENT_CONNECTOR_PLUGIN_ID }}" \
            -Dconfluent.kafka.api.key="${{ secrets.CONFLUENT_KAFKA_API_KEY }}" \
            -Dconfluent.kafka.api.secret="${{ secrets.CONFLUENT_KAFKA_API_SECRET }}" \
            -Dconfluent.schema.registry.api.key="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_KEY }}" \
            -Dconfluent.schema.registry.api.secret="${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_SECRET }}" \
            -Dconfluent.cloud.resource.api.key="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_KEY }}" \
            -Dconfluent.cloud.resource.api.secret="${{ secrets.CONFLUENT_CLOUD_RESOURCE_API_SECRET }}" \
            -Dloadtest.query="${{ github.event.inputs.query }}" \
            -Dloadtest.post.processing.script="${{ github.event.inputs.post_processing_script || 'select 1' }}" \
            -Dloadtest.table.schema="${{ github.event.inputs.table_schema }}" \
            -Dloadtest.connector.name="${{ github.event.inputs.connector_name || 'schemaless-query-load-test' }}" \
            -Dloadtest.topic.name="${{ github.event.inputs.topic_name || 'schemaless-query-load-test-topic' }}"
        env:
          # Additional environment variables if needed
          GRADLE_OPTS: "-Xmx2g"
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_number }}
          path: |
            build/reports/
            build/test-results/
            *.log
          retention-days: 30
