name: Cloud Integration Tests

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
      account:
        description: 'Account override'
        required: false
        type: string

  workflow_call:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
      account:
        description: 'Account override'
        required: false
        type: string


env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Validate database and engine
        if: ${{ (inputs.database == '') != (inputs.engine == '') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.setFailed("Database and Engine parameters should be provided simultaneously")

      - name: Resolve account
        id: set-account
        shell: bash  # use bash across all OSs
        run: |
          if ! [[ -z "${{ inputs.account }}" ]]; then
            echo "account=${{ inputs.account }}" >> $GITHUB_OUTPUT
            echo "account=${{ inputs.account }}"
          else
            echo "account=${{ vars.FIREBOLT_ACCOUNT }}" >> $GITHUB_OUTPUT
            echo "account=${{ vars.FIREBOLT_ACCOUNT }}"
          fi

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Reduce db suffix name
        id: dbsuffix
        shell: bash
        run: |
          echo "db_suffix=kafka" >> $GITHUB_OUTPUT

      - name: Setup database and engine
        id: setup
        if: ${{ inputs.database == '' }}
        uses: firebolt-db/integration-testing-setup@813c4835ef38adcba3f8760e7afc21a3c7248023
        with:
          firebolt-client-id: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          firebolt-client-secret: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          account: ${{ steps.set-account.outputs.account }}
          api-endpoint: "api.staging.firebolt.io"
          db_suffix: ${{ steps.dbsuffix.outputs.db_suffix }}

      - name: Determine database name
        id: find-database-name
        shell: bash  # use bash across all OSs
        run: |
          if ! [[ -z "${{ inputs.database }}" ]]; then
             echo "database_name=${{ inputs.database }}" >> $GITHUB_OUTPUT
          else
             echo "database_name=${{ steps.setup.outputs.database_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine engine name
        id: find-engine-name
        shell: bash  # use bash across all OSs
        run: |
          if ! [[ -z "${{ inputs.engine }}" ]]; then
             echo "engine_name=${{ inputs.engine }}" >> $GITHUB_OUTPUT
          else
             echo "engine_name=${{ steps.setup.outputs.engine_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build --no-daemon

      - name: Deploy to Kafka Connect
        run: ./gradlew deployToKafkaConnect --no-daemon

      - name: Determine docker-compose file
        run: |
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-cloud"
          COMPOSE_FILE="$COMPOSE_FILE_DIR/docker-compose.yml"
          echo "COMPOSE_FILE_DIR=$COMPOSE_FILE_DIR" >> $GITHUB_ENV
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> $GITHUB_ENV
          echo "Using docker-compose file: $COMPOSE_FILE"

      - name: Replace secrets in properties file
        run: |
          SECRETS_FILE="src/integrationTest/docker/kafka-connect-cloud/secrets/secrets.properties"
          echo "Replacing placeholders in $SECRETS_FILE"
          sed -i "s/\${clientId}/${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}/g" "$SECRETS_FILE"
          sed -i "s/\${clientSecret}/${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}/g" "$SECRETS_FILE"
          echo "Secrets replaced successfully"

      - name: Start Docker services
        run: |
          echo "Starting Docker services with $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up -d
          
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 30
          
          # Verify Kafka Connect is ready
          echo "Checking if Kafka Connect is ready..."
          timeout 60 bash -c 'until curl -f http://localhost:8083/connectors; do sleep 2; done'
          echo "Kafka Connect is ready!"

      - name: Run integration tests (excluding NOT_IMPLEMENTED)
        run: ./gradlew integrationTest -Djunit.jupiter.excludeTags=not_implemented --no-daemon -Djdbc.connection.url="jdbc:firebolt:${{ steps.find-database-name.outputs.database_name }}?account=${{ steps.set-account.outputs.account }}&engine=${{ steps.find-engine-name.outputs.engine_name }}&env=staging" -DclientId="${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}" -DclientSecret="${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}"
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
          KAFKA_CONNECT_URL: http://localhost:8083
          KAFKA_CONNECT_VERSION: 4.0

      - name: Collect Docker logs
        if: always()
        run: |
          echo "Collecting Docker logs..."
          mkdir -p docker-logs
          
          # Get logs from all containers
          docker compose -f "$COMPOSE_FILE" logs > docker-logs/all-services.log 2>&1 || true
          
          # Get individual service logs
          docker compose -f "$COMPOSE_FILE" logs kafka-connect > docker-logs/kafka-connect.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" logs kafka > docker-logs/kafka.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" logs schema-registry > docker-logs/schema-registry.log 2>&1 || true
          
          # Get container status
          docker compose -f "$COMPOSE_FILE" ps > docker-logs/container-status.txt 2>&1 || true
          
          # Collect integration test logs
          if [ -f "logs/integrationTest.log" ]; then
            echo "Collecting integration test logs..."
            cp logs/integrationTest.log docker-logs/ || true
          else
            echo "No integration test log file found at logs/integrationTest.log"
          fi
          
          echo "Docker logs collected successfully"

      - name: Stop Docker services
        if: always()
        run: |
          echo "Stopping Docker services..."
          docker compose -f "$COMPOSE_FILE" down -v
          echo "Docker services stopped"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-test-results-cloud
          path: |
            build/test-results/
            build/reports/tests/
            logs/

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-test-reports-cloud
          path: build/reports/

      - name: Upload Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docker-logs-cloud
          path: docker-logs/