name: Cloud Integration Tests

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
      account:
        description: 'Account override'
        required: false
        type: string

  workflow_call:
    secrets:
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: true
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: true
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
      account:
        description: 'Account override'
        required: false
        type: string

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate database and engine
        if: ${{ (inputs.database == '') != (inputs.engine == '') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed("Database and Engine parameters should be provided simultaneously")

      - name: Resolve account
        id: set-account
        shell: bash  # use bash across all OSs
        env:
          INPUT_ACCOUNT: ${{ inputs.account }}
          VAR_FIREBOLT_ACCOUNT: ${{ vars.FIREBOLT_ACCOUNT }}
        run: |
          if ! [[ -z "${INPUT_ACCOUNT}" ]]; then
            echo "account=${INPUT_ACCOUNT}" >> "$GITHUB_OUTPUT"
            echo "account=${INPUT_ACCOUNT}"
          else
            echo "account=${VAR_FIREBOLT_ACCOUNT}" >> "$GITHUB_OUTPUT"
            echo "account=${VAR_FIREBOLT_ACCOUNT}"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Reduce db suffix name
        id: dbsuffix
        shell: bash
        run: |
          echo "db_suffix=kafka" >> "$GITHUB_OUTPUT"

      - name: Setup database and engine
        id: setup
        if: ${{ inputs.database == '' }}
        uses: firebolt-db/integration-testing-setup@cb12b3740af5572d9b4e8759258d5bed9febc7e9 # v2.7.0
        with:
          firebolt-client-id: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          firebolt-client-secret: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          account: ${{ steps.set-account.outputs.account }}
          api-endpoint: "api.staging.firebolt.io"
          db_suffix: ${{ steps.dbsuffix.outputs.db_suffix }}

      - name: Determine database name
        id: find-database-name
        shell: bash  # use bash across all OSs
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          SETUP_DATABASE_NAME: ${{ steps.setup.outputs.database_name }}
        run: |
          if ! [[ -z "${INPUT_DATABASE}" ]]; then
             echo "database_name=${INPUT_DATABASE}" >> "$GITHUB_OUTPUT"
          else
             echo "database_name=${SETUP_DATABASE_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine name
        id: find-engine-name
        shell: bash  # use bash across all OSs
        env:
          INPUT_ENGINE: ${{ inputs.engine }}
          SETUP_ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
        run: |
          if ! [[ -z "${INPUT_ENGINE}" ]]; then
             echo "engine_name=${INPUT_ENGINE}" >> "$GITHUB_OUTPUT"
          else
             echo "engine_name=${SETUP_ENGINE_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build --no-daemon

      - name: Deploy to Kafka Connect
        run: ./gradlew deployToKafkaConnect --no-daemon

      - name: Determine docker-compose file
        run: |
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-cloud"
          COMPOSE_FILE="$COMPOSE_FILE_DIR/docker-compose.yml"
          {
            echo "COMPOSE_FILE_DIR=$COMPOSE_FILE_DIR"
            echo "COMPOSE_FILE=$COMPOSE_FILE"
          } >> "$GITHUB_ENV"
          echo "Using docker-compose file: $COMPOSE_FILE"

      - name: Replace secrets in properties file
        env:
          FIREBOLT_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          FIREBOLT_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
        run: |
          SECRETS_FILE="src/integrationTest/docker/kafka-connect-cloud/secrets/secrets.properties"
          echo "Replacing placeholders in $SECRETS_FILE"
          # Substitute with bash builtins rather than sed so the secrets are
          # never part of a process's command line. The placeholders are literal.
          # shellcheck disable=SC2016
          id_placeholder='${clientId}' secret_placeholder='${clientSecret}'
          content="$(<"$SECRETS_FILE")"
          content="${content//"$id_placeholder"/"$FIREBOLT_CLIENT_ID"}"
          content="${content//"$secret_placeholder"/"$FIREBOLT_CLIENT_SECRET"}"
          printf '%s\n' "$content" > "$SECRETS_FILE"
          echo "Secrets replaced successfully"

      - name: Start Docker services
        run: |
          echo "Starting Docker services with $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up -d
          
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 30
          
          # Verify Kafka Connect is ready
          echo "Checking if Kafka Connect is ready..."
          timeout 60 bash -c 'until curl -f http://localhost:8083/connectors; do sleep 2; done'
          echo "Kafka Connect is ready!"

      - name: Run integration tests (excluding NOT_IMPLEMENTED and E2E)
        # The credentials reach the test JVM as the clientId/clientSecret system
        # properties via the IT_* env vars (see build.gradle), not as -D arguments.
        run: ./gradlew integrationTest -Djunit.jupiter.excludeTags=not_implemented,e2e --no-daemon -Djdbc.connection.url="jdbc:firebolt:${DATABASE_NAME}?account=${ACCOUNT_NAME}&engine=${ENGINE_NAME}&env=staging"
        env:
          DATABASE_NAME: ${{ steps.find-database-name.outputs.database_name }}
          ACCOUNT_NAME: ${{ steps.set-account.outputs.account }}
          ENGINE_NAME: ${{ steps.find-engine-name.outputs.engine_name }}
          IT_FIREBOLT_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          IT_FIREBOLT_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
          KAFKA_CONNECT_URL: http://localhost:8083
          KAFKA_CONNECT_VERSION: 4.0

      - name: Collect Docker logs
        if: always()
        run: |
          echo "Collecting Docker logs..."
          mkdir -p docker-logs
          
          # Get logs from all containers
          docker compose -f "$COMPOSE_FILE" logs > docker-logs/all-services.log 2>&1 || true
          
          # Get individual service logs
          docker compose -f "$COMPOSE_FILE" logs kafka-connect > docker-logs/kafka-connect.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" logs kafka > docker-logs/kafka.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" logs schema-registry > docker-logs/schema-registry.log 2>&1 || true
          
          # Get container status
          docker compose -f "$COMPOSE_FILE" ps > docker-logs/container-status.txt 2>&1 || true
          
          # Collect integration test logs
          if [ -f "logs/integrationTest.log" ]; then
            echo "Collecting integration test logs..."
            cp logs/integrationTest.log docker-logs/ || true
          else
            echo "No integration test log file found at logs/integrationTest.log"
          fi
          
          echo "Docker logs collected successfully"

      - name: Scrub credentials from logs and reports
        # The connector was configured with the Firebolt credentials (see
        # secrets.properties), so mask them in everything uploaded below.
        if: always()
        env:
          SCRUB_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          SCRUB_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
        run: |
          # perl reads the values from the environment, so they stay off the command line.
          # shellcheck disable=SC2016
          for dir in docker-logs logs build/test-results build/reports; do
            [ -d "$dir" ] || continue
            find "$dir" -type f -print0 | xargs -0 -r perl -pi -e '
              for my $name ("SCRUB_CLIENT_SECRET", "SCRUB_CLIENT_ID") {
                my $value = $ENV{$name};
                s/\Q$value\E/***/g if defined $value && length $value;
              }'
          done
          echo "Credentials scrubbed"

      - name: Stop Docker services
        if: always()
        run: |
          echo "Stopping Docker services..."
          docker compose -f "$COMPOSE_FILE" down -v
          echo "Docker services stopped"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results-cloud
          path: |
            build/test-results/
            build/reports/tests/
            logs/

      - name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-reports-cloud
          path: build/reports/

      - name: Upload Docker logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-logs-cloud
          path: docker-logs/