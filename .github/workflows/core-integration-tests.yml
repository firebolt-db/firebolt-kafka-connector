name: Core Integration Tests

on:
  workflow_dispatch:
    inputs:
      kafka_connect_version:
        description: 'Kafka Connect version to test with'
        required: true
        default: '3.9.1'
        type: choice
        options:
          - '3.9.1'
          - '4.0'
      suite:
        description: 'Test suite to run (serialization, connector, lifecycle, stress, customer, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'serialization'
          - 'connector'
          - 'lifecycle'
          - 'stress'
          - 'customer'
      shard_index:
        description: 'Shard index (0-based). Only used when shard_total > 1.'
        required: false
        default: '0'
        type: string
      shard_total:
        description: 'Total number of shards for this suite run.'
        required: false
        default: '1'
        type: string
  workflow_call:
    inputs:
      kafka_connect_version:
        description: 'Kafka Connect version to test with'
        required: false
        default: '3.9.1'
        type: string
      suite:
        description: 'Test suite to run (serialization, connector, lifecycle, stress, customer, all)'
        required: false
        default: 'all'
        type: string
      shard_index:
        description: 'Shard index (0-based). Only used when shard_total > 1.'
        required: false
        default: 0
        type: number
      shard_total:
        description: 'Total number of shards for this suite run.'
        required: false
        default: 1
        type: number
     
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  FIREBOLT_CORE_IMAGE: ${{ vars.FIREBOLT_CORE_IMAGE }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free disk space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
        sudo docker image prune --all --force
        df -h

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      
    - name: Set up JDK 11
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Enforce suite tag coverage
      run: |
        UNTAGGED=""
        for f in $(find src/integrationTest -name "*Test.java" | grep -v "Base" | grep -v "load/" | grep -v "utils/" | grep -v "datatype/"); do
          if ! grep -q '@Tag(TestTag\.\(SERIALIZATION\|CONNECTOR\|LIFECYCLE\|STRESS\|CUSTOMER\))' "$f"; then
            UNTAGGED="$UNTAGGED\n  $(basename $f .java)"
          fi
        done

        if [ -n "$UNTAGGED" ]; then
          echo "ERROR: The following integration test classes are missing a suite @Tag annotation:"
          echo -e "$UNTAGGED"
          echo ""
          echo "Every integration test class must have exactly one of: @Tag(TestTag.SERIALIZATION), @Tag(TestTag.CONNECTOR), @Tag(TestTag.LIFECYCLE), @Tag(TestTag.STRESS), @Tag(TestTag.CUSTOMER)"
          exit 1
        fi
        echo "✓ All integration test classes have suite tags"
        
    - name: Display Kafka Connect version
      run: |
        echo "Testing with Kafka Connect version: ${{ inputs.kafka_connect_version }}"
        echo "Suite: ${{ inputs.suite }}"
        echo "Shard: ${{ inputs.shard_index }} / ${{ inputs.shard_total }}"

    - name: Compute test filter
      run: |
        SUITE="${{ inputs.suite }}"
        SHARD_INDEX="${{ inputs.shard_index }}"
        SHARD_TOTAL="${{ inputs.shard_total }}"

        # Set suite-level include tag filter (empty means run all suites)
        if [ "$SUITE" = "all" ] || [ -z "$SUITE" ]; then
          SUITE_TAG_FILTER=""
        else
          SUITE_TAG_FILTER="-Djunit.jupiter.includeTags=$SUITE"
        fi

        # Apply sharding within the suite if shard_total > 1
        if [ "$SHARD_TOTAL" = "1" ] || [ -z "$SHARD_TOTAL" ]; then
          echo "Running suite '$SUITE' (no sharding)"
          echo "SUITE_TAG_FILTER=$SUITE_TAG_FILTER" >> $GITHUB_ENV
          echo "TEST_FILTER=" >> $GITHUB_ENV
        else
          echo "Computing shard $SHARD_INDEX of $SHARD_TOTAL within suite '$SUITE'"

          if [ "$SUITE" = "all" ] || [ -z "$SUITE" ]; then
            # Shard across every integration test class
            TEST_CLASSES=$(find src/integrationTest -name "*Test.java" \
              | grep -v "Base" | grep -v "load/" | grep -v "utils/" \
              | sed 's|.*/||; s|\.java$||' | sort \
              | awk -v shard="$SHARD_INDEX" -v total="$SHARD_TOTAL" '(NR-1) % total == shard')
          else
            # Shard within the tagged suite subset
            SUITE_UPPER=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]')
            TEST_CLASSES=$(grep -rl "@Tag(TestTag.$SUITE_UPPER)" src/integrationTest \
              | grep -v "Base" | grep -v "load/" | grep -v "utils/" | grep -v "datatype/" \
              | sed 's|.*/||; s|\.java$||' | sort \
              | awk -v shard="$SHARD_INDEX" -v total="$SHARD_TOTAL" '(NR-1) % total == shard')
          fi

          # Build --tests arguments (one --tests flag per class)
          TEST_FILTER=""
          while IFS= read -r cls; do
            [ -z "$cls" ] && continue
            TEST_FILTER="$TEST_FILTER --tests *.$cls"
          done <<< "$TEST_CLASSES"

          CLASS_COUNT=$(echo "$TEST_CLASSES" | grep -c . || true)
          echo "Shard $SHARD_INDEX will run $CLASS_COUNT classes:"
          echo "$TEST_CLASSES"
          echo "SUITE_TAG_FILTER=$SUITE_TAG_FILTER" >> $GITHUB_ENV
          echo "TEST_FILTER=$TEST_FILTER" >> $GITHUB_ENV
        fi
        
    - name: Build project
      run: ./gradlew build --no-daemon
      
    - name: Deploy to Kafka Connect
      run: ./gradlew deployToKafkaConnect --no-daemon
      
    - name: Determine docker-compose file
      run: |
        KAFKA_CONNECT_VERSION="${{ inputs.kafka_connect_version }}"
        if [ "$KAFKA_CONNECT_VERSION" = "4.0" ]; then
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-4.0"
        else
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-3.9.1"
        fi
        COMPOSE_FILE="$COMPOSE_FILE_DIR/docker-compose.yml"
        echo "COMPOSE_FILE_DIR=$COMPOSE_FILE_DIR" >> $GITHUB_ENV
        echo "COMPOSE_FILE=$COMPOSE_FILE" >> $GITHUB_ENV
        echo "Using docker-compose file: $COMPOSE_FILE"

    - name: Setup firebolt core permissions
      run: |
        WHO="$(docker run --rm --entrypoint whoami ${{ vars.FIREBOLT_CORE_IMAGE }})"
        # Ensure the host directory that is mounted to /firebolt-core/data exists
        if [ "$WHO" = "firebolt-core" ]; then
          mkdir -p "$COMPOSE_FILE_DIR/firebolt-core"
          sudo chown 1111:1111 "$COMPOSE_FILE_DIR/firebolt-core"
        fi

    - name: Start Docker services
      run: |
        echo "Starting Docker services with $COMPOSE_FILE"
        docker compose -f "$COMPOSE_FILE" up -d
        
        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Verify Kafka Connect is ready
        echo "Checking if Kafka Connect is ready..."
        timeout 60 bash -c 'until curl -f http://localhost:8083/connectors; do sleep 2; done'
        echo "Kafka Connect is ready!"

    - name: Run integration tests (excluding not_implemented and cloud)
      run: ./gradlew integrationTest -Djunit.jupiter.excludeTags=not_implemented,cloud ${{ env.SUITE_TAG_FILTER }} --no-daemon ${{ env.TEST_FILTER }}
      env:
        KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        SCHEMA_REGISTRY_URL: http://localhost:8081
        KAFKA_CONNECT_URL: http://localhost:8083
        KAFKA_CONNECT_VERSION: ${{ inputs.kafka_connect_version }}

    - name: Collect Docker logs
      if: always()
      run: |
        echo "Collecting Docker logs..."
        mkdir -p docker-logs
        
        # Get logs from all containers
        docker compose -f "$COMPOSE_FILE" logs > docker-logs/all-services.log 2>&1 || true
        
        # Get individual service logs
        docker compose -f "$COMPOSE_FILE" logs kafka-connect > docker-logs/kafka-connect.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs kafka > docker-logs/kafka.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs zookeeper > docker-logs/zookeeper.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs schema-registry > docker-logs/schema-registry.log 2>&1 || true
        
        # Get container status
        docker compose -f "$COMPOSE_FILE" ps > docker-logs/container-status.txt 2>&1 || true
        
        # Collect integration test logs
        if [ -f "logs/integrationTest.log" ]; then
          echo "Collecting integration test logs..."
          cp logs/integrationTest.log docker-logs/ || true
        else
          echo "No integration test log file found at logs/integrationTest.log"
        fi
        
        echo "Docker logs collected successfully"
        
    - name: Stop Docker services
      if: always()
      run: |
        echo "Stopping Docker services..."
        docker compose -f "$COMPOSE_FILE" down -v
        echo "Docker services stopped"
        
    - name: Upload test results
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: integration-test-results-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: |
          build/test-results/
          build/reports/tests/
          logs/
          
    - name: Upload test reports
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: integration-test-reports-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: build/reports/
        
    - name: Upload Docker logs
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: docker-logs-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: docker-logs/
