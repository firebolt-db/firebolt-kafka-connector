name: Core Integration Tests

on:
  workflow_dispatch:
    inputs:
      kafka_connect_version:
        description: 'Kafka Connect version to test with'
        required: true
        default: '3.9.1'
        type: choice
        options:
          - '3.9.1'
          - '4.0'
      suite:
        description: 'Test suite to run (serialization, connector, lifecycle, stress, customer, e2e, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'serialization'
          - 'connector'
          - 'lifecycle'
          - 'stress'
          - 'customer'
          - 'e2e'
      shard_index:
        description: 'Shard index (0-based)'
        required: false
        default: '1'
        type: string
      shard_total:
        description: 'Total number of shards for this suite run'
        required: false
        default: '1'
        type: string
  workflow_call:
    inputs:
      kafka_connect_version:
        description: 'Kafka Connect version to test with'
        required: false
        default: '3.9.1'
        type: string
      suite:
        description: 'Test suite to run (serialization, connector, lifecycle, stress, customer, e2e, all)'
        required: false
        default: 'all'
        type: string
      shard_index:
        description: 'Shard index (0-based)'
        required: false
        default: 1
        type: number
      shard_total:
        description: 'Total number of shards for this suite run'
        required: false
        default: 1
        type: number

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # OSS Firebolt engine artefact. Overridable via the FIREBOLT_ENGINE_IMAGE repo
  # variable; falls back to the `dev` tag (freshest build off the engine's master).
  FIREBOLT_ENGINE_IMAGE: ${{ vars.FIREBOLT_ENGINE_IMAGE || 'ghcr.io/firebolt-db/engine:dev' }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free disk space
      run: |
        AVAIL_GB=$(df --output=avail / | tail -1 | awk '{printf "%d", $1/1024/1024}')
        if [ "$AVAIL_GB" -lt 50 ]; then
          echo "Available disk: ${AVAIL_GB}GB — freeing space..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo docker image prune --all --force
          df -h
        else
          echo "Available disk: ${AVAIL_GB}GB — sufficient, skipping cleanup"
        fi

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      
    - name: Set up JDK 11
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Enforce suite tag coverage
      run: |
        UNTAGGED=$(find src/integrationTest -name "*Test.java" \
          | grep -v "Base" | grep -v "load/" | grep -v "utils/" | grep -v "datatype/" \
          | xargs grep -EL '@Tag\(TestTag\.(SERIALIZATION|CONNECTOR|LIFECYCLE|STRESS|CUSTOMER|E2E)\)' \
          | sed 's|.*/||; s|\.java$||')
        if [ -n "$UNTAGGED" ]; then
          echo "ERROR: Missing suite @Tag on:"
          echo "$UNTAGGED"
          echo "Each class must have one of: @Tag(TestTag.SERIALIZATION/CONNECTOR/LIFECYCLE/STRESS/CUSTOMER/E2E)"
          exit 1
        fi
        echo "✓ All integration test classes have suite tags"
        
    - name: Display Kafka Connect version
      run: |
        echo "Testing with Kafka Connect version: ${{ inputs.kafka_connect_version }}"
        echo "Suite: ${{ inputs.suite }}"
        echo "Shard: ${{ inputs.shard_index }} / ${{ inputs.shard_total }}"

    - name: Compute test filter
      run: |
        SUITE="${{ inputs.suite }}"
        SHARD_INDEX="${{ inputs.shard_index }}"
        SHARD_TOTAL="${{ inputs.shard_total }}"

        # Suite-level include tag filter
        if [ "$SUITE" = "all" ] || [ -z "$SUITE" ]; then
          SUITE_TAG_FILTER=""
        else
          SUITE_TAG_FILTER="-Djunit.jupiter.includeTags=$SUITE"
        fi

        # Discover test classes — filter by suite tag BEFORE sharding so that
        # round-robin distributes only the suite's own classes evenly
        if [ "$SUITE" = "all" ] || [ -z "$SUITE" ]; then
          TEST_CLASSES=$(find src/integrationTest -name "*Test.java" \
            | grep -v "Base" | grep -v "load/" | grep -v "utils/" \
            | sed 's|.*/||; s|\.java$||' | sort)
        else
          TAG_CONSTANT=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]')
          TEST_CLASSES=$(find src/integrationTest -name "*Test.java" \
            | grep -v "Base" | grep -v "load/" | grep -v "utils/" \
            | xargs grep -l "@Tag(TestTag.$TAG_CONSTANT)" \
            | sed 's|.*/||; s|\.java$||' | sort)
        fi

        # Round-robin shard across the scoped class list
        SHARDED_CLASSES=$(echo "$TEST_CLASSES" \
          | awk -v shard="$SHARD_INDEX" -v total="$SHARD_TOTAL" 'NR % total == shard % total')

        TEST_FILTER=""
        while IFS= read -r cls; do
          [ -z "$cls" ] && continue
          TEST_FILTER="$TEST_FILTER --tests *.$cls"
        done <<< "$SHARDED_CLASSES"

        CLASS_COUNT=$(echo "$SHARDED_CLASSES" | grep -c . || true)
        echo "Suite '$SUITE', shard $SHARD_INDEX/$SHARD_TOTAL: $CLASS_COUNT classes"
        echo "SUITE_TAG_FILTER=$SUITE_TAG_FILTER" >> $GITHUB_ENV
        echo "TEST_FILTER=$TEST_FILTER" >> $GITHUB_ENV
        
    - name: Build project
      run: ./gradlew build --no-daemon
      
    - name: Deploy to Kafka Connect
      run: ./gradlew deployToKafkaConnect --no-daemon
      
    - name: Determine docker-compose file
      run: |
        KAFKA_CONNECT_VERSION="${{ inputs.kafka_connect_version }}"
        if [ "$KAFKA_CONNECT_VERSION" = "4.0" ]; then
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-4.0"
        else
          COMPOSE_FILE_DIR="src/integrationTest/docker/kafka-connect-3.9.1"
        fi
        COMPOSE_FILE="$COMPOSE_FILE_DIR/docker-compose.yml"
        echo "COMPOSE_FILE_DIR=$COMPOSE_FILE_DIR" >> $GITHUB_ENV
        echo "COMPOSE_FILE=$COMPOSE_FILE" >> $GITHUB_ENV
        echo "Using docker-compose file: $COMPOSE_FILE"

    - name: Setup firebolt engine data directory permissions
      run: |
        # The engine runs as a non-root user and writes into the /firebolt-core/volume
        # bind mount, so the host dir must be owned by the image's uid:gid. Read it from
        # the image rather than hardcoding (a root image yields 0:0, a harmless no-op).
        ENGINE_UID="$(docker run --rm --entrypoint id "$FIREBOLT_ENGINE_IMAGE" -u)"
        ENGINE_GID="$(docker run --rm --entrypoint id "$FIREBOLT_ENGINE_IMAGE" -g)"
        mkdir -p "$COMPOSE_FILE_DIR/firebolt-core"
        sudo chown "$ENGINE_UID:$ENGINE_GID" "$COMPOSE_FILE_DIR/firebolt-core"

    - name: Start Docker services
      run: |
        echo "Starting Docker services with $COMPOSE_FILE"
        docker compose -f "$COMPOSE_FILE" up -d
        
        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Verify Kafka Connect is ready
        echo "Checking if Kafka Connect is ready..."
        timeout 60 bash -c 'until curl -f http://localhost:8083/connectors; do sleep 2; done'
        echo "Kafka Connect is ready!"

    - name: Run integration tests (excluding not_implemented and cloud)
      run: ./gradlew integrationTest -Djunit.jupiter.excludeTags=not_implemented,cloud ${{ env.SUITE_TAG_FILTER }} --no-daemon ${{ env.TEST_FILTER }}
      env:
        KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        SCHEMA_REGISTRY_URL: http://localhost:8081
        KAFKA_CONNECT_URL: http://localhost:8083
        KAFKA_CONNECT_VERSION: ${{ inputs.kafka_connect_version }}

    - name: Collect Docker logs
      if: always()
      run: |
        echo "Collecting Docker logs..."
        mkdir -p docker-logs
        
        # Get logs from all containers
        docker compose -f "$COMPOSE_FILE" logs > docker-logs/all-services.log 2>&1 || true
        
        # Get individual service logs
        docker compose -f "$COMPOSE_FILE" logs kafka-connect > docker-logs/kafka-connect.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs kafka > docker-logs/kafka.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs zookeeper > docker-logs/zookeeper.log 2>&1 || true
        docker compose -f "$COMPOSE_FILE" logs schema-registry > docker-logs/schema-registry.log 2>&1 || true
        
        # Get container status
        docker compose -f "$COMPOSE_FILE" ps > docker-logs/container-status.txt 2>&1 || true
        
        # Collect integration test logs
        if [ -f "logs/integrationTest.log" ]; then
          echo "Collecting integration test logs..."
          cp logs/integrationTest.log docker-logs/ || true
        else
          echo "No integration test log file found at logs/integrationTest.log"
        fi
        
        echo "Docker logs collected successfully"
        
    - name: Stop Docker services
      if: always()
      run: |
        echo "Stopping Docker services..."
        docker compose -f "$COMPOSE_FILE" down -v
        echo "Docker services stopped"
        
    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: integration-test-results-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: |
          build/test-results/
          build/reports/tests/
          logs/
          
    - name: Upload test reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: integration-test-reports-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: build/reports/
        
    - name: Upload Docker logs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: docker-logs-${{ inputs.kafka_connect_version }}-${{ inputs.suite }}-shard-${{ inputs.shard_index }}
        path: docker-logs/
