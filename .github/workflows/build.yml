name: Build

on:
  workflow_call:
    inputs:
      branch:
        description: 'Git ref (branch or tag) to build'
        required: false
        type: string
      buildArtifacts:
        description: 'Build and upload release artifacts (uber-jar and sources-jar)'
        required: false
        type: boolean
        default: false
      buildConfluentArchive:
        description: 'Build and upload the Confluent Hub archive ZIP'
        required: false
        type: boolean
        default: false
    
    outputs:
      uber-jar:
        description: 'Artifact name for uber JAR'
        value: ${{ jobs.build.outputs.uber-jar }}
      sources-jar:
        description: 'Artifact name for sources JAR'
        value: ${{ jobs.build.outputs.sources-jar }}
      confluent-archive:
        description: 'Artifact name for Confluent Hub archive ZIP'
        value: ${{ jobs.build.outputs.confluent-archive }}
  push:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      uber-jar: ${{ steps.artifact_names.outputs.uber_name }}
      sources-jar: ${{ steps.artifact_names.outputs.sources_name }}
      confluent-archive: ${{ steps.artifact_names.outputs.confluent_name }}
    
    strategy:
      matrix:
        java: [ '11' ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ inputs.branch }}
      
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
        
    - name: Cache Gradle packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      
    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Build sources JAR
      if: ${{ inputs.buildArtifacts }}
      run: ./gradlew sourcesJar --no-daemon
    
    - name: Compute artifact names
      if: ${{ inputs.buildArtifacts || inputs.buildConfluentArchive }}
      id: artifact_names
      run: |
        BASE=$(grep '^archivesBaseName=' gradle.properties | sed 's/archivesBaseName=//')
        VERSION=$(grep '^version=' gradle.properties | sed 's/version=//')
        echo "uber_name=${BASE}-${VERSION}.jar" >> $GITHUB_OUTPUT
        echo "sources_name=${BASE}-${VERSION}-sources.jar" >> $GITHUB_OUTPUT
        echo "uber_path=build/libs/${BASE}-${VERSION}.jar" >> $GITHUB_OUTPUT
        echo "sources_path=build/libs/${BASE}-${VERSION}-sources.jar" >> $GITHUB_OUTPUT
        echo "confluent_name=firebolt-db-firebolt-kafka-connect-${VERSION}.zip" >> $GITHUB_OUTPUT
        echo "confluent_path=build/confluent/firebolt-db-firebolt-kafka-connect-${VERSION}.zip" >> $GITHUB_OUTPUT
              
    - name: Upload test results
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: test-results-${{ matrix.java }}
        path: |
          build/test-results/
          build/reports/tests/
        overwrite: true
        
    - name: Upload uber JAR artifact
      if: ${{ inputs.buildArtifacts }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ steps.artifact_names.outputs.uber_name }}
        path: ${{ steps.artifact_names.outputs.uber_path }}
        if-no-files-found: error

    - name: Upload sources JAR artifact
      if: ${{ inputs.buildArtifacts }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ steps.artifact_names.outputs.sources_name }}
        path: ${{ steps.artifact_names.outputs.sources_path }}
        if-no-files-found: error

    - name: Build Confluent Hub archive
      if: ${{ inputs.buildConfluentArchive }}
      run: ./gradlew createConfluentArchive --no-daemon

    - name: Upload Confluent Hub archive
      if: ${{ inputs.buildConfluentArchive }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ steps.artifact_names.outputs.confluent_name }}
        path: ${{ steps.artifact_names.outputs.confluent_path }}
        if-no-files-found: error
          
    - name: Upload build reports
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: build-reports-${{ matrix.java }}
        path: build/reports/
        overwrite: true