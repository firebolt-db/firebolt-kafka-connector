name: Build

on:
  workflow_call:
    inputs:
      branch:
        description: 'Git ref (branch or tag) to build'
        required: false
        type: string
      buildArtifacts:
        description: 'Build and upload release artifacts (uber-jar and sources-jar)'
        required: false
        type: boolean
        default: false
      buildConfluentArchive:
        description: 'Build and upload the Confluent Hub archive ZIP'
        required: false
        type: boolean
        default: false
    
    outputs:
      uber-jar:
        description: 'Artifact name for uber JAR'
        value: ${{ jobs.build.outputs.uber-jar }}
      sources-jar:
        description: 'Artifact name for sources JAR'
        value: ${{ jobs.build.outputs.sources-jar }}
      confluent-archive:
        description: 'Artifact name for Confluent Hub archive ZIP'
        value: ${{ jobs.build.outputs.confluent-archive }}
  push:

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      uber-jar: ${{ steps.artifact_names.outputs.uber_name }}
      sources-jar: ${{ steps.artifact_names.outputs.sources_name }}
      confluent-archive: ${{ steps.artifact_names.outputs.confluent_name }}
    
    strategy:
      matrix:
        java: [ '11' ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.branch }}
        persist-credentials: false
      
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        # No dependency caching for release builds (buildArtifacts), to avoid cache poisoning.
        cache: ${{ !inputs.buildArtifacts && 'gradle' || '' }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-disabled: ${{ inputs.buildArtifacts == true }}
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
        
    - name: Cache Gradle packages
      if: ${{ !inputs.buildArtifacts }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      
    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Build sources JAR
      if: ${{ inputs.buildArtifacts }}
      run: ./gradlew sourcesJar --no-daemon
    
    - name: Compute artifact names
      if: ${{ inputs.buildArtifacts || inputs.buildConfluentArchive }}
      id: artifact_names
      run: |
        BASE=$(grep '^archivesBaseName=' gradle.properties | sed 's/archivesBaseName=//')
        VERSION=$(grep '^version=' gradle.properties | sed 's/version=//')
        {
          echo "uber_name=${BASE}-${VERSION}.jar"
          echo "sources_name=${BASE}-${VERSION}-sources.jar"
          echo "uber_path=build/libs/${BASE}-${VERSION}.jar"
          echo "sources_path=build/libs/${BASE}-${VERSION}-sources.jar"
          echo "confluent_name=firebolt-db-firebolt-kafka-connect-${VERSION}.zip"
          echo "confluent_path=build/confluent/firebolt-db-firebolt-kafka-connect-${VERSION}.zip"
        } >> "$GITHUB_OUTPUT"
              
    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test-results-${{ matrix.java }}
        path: |
          build/test-results/
          build/reports/tests/
        overwrite: true
        
    - name: Upload uber JAR artifact
      if: ${{ inputs.buildArtifacts }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact_names.outputs.uber_name }}
        path: ${{ steps.artifact_names.outputs.uber_path }}
        if-no-files-found: error

    - name: Upload sources JAR artifact
      if: ${{ inputs.buildArtifacts }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact_names.outputs.sources_name }}
        path: ${{ steps.artifact_names.outputs.sources_path }}
        if-no-files-found: error

    - name: Build Confluent Hub archive
      if: ${{ inputs.buildConfluentArchive }}
      run: ./gradlew createConfluentArchive --no-daemon

    - name: Upload Confluent Hub archive
      if: ${{ inputs.buildConfluentArchive }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact_names.outputs.confluent_name }}
        path: ${{ steps.artifact_names.outputs.confluent_path }}
        if-no-files-found: error
          
    - name: Upload build reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: build-reports-${{ matrix.java }}
        path: build/reports/
        overwrite: true